# The Flutter template asks for an 8 GB heap, which a JVM cannot even reserve
# on an 8 GB machine that is also running an emulator -- the daemon dies before
# it can accept a connection, and Gradle reports it as "Unable to establish
# loopback connection". This project is small; 1.5 GB builds it comfortably.
org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
android.useAndroidX=true
android.enableJetifier=true
