name: plexqo_run
description: "RUN — a simple, reliable running tracker: start, track, pause/resume, finish, review."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.0.2
  latlong2: ^0.10.1
  path_provider: ^2.1.5
  wakelock_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
